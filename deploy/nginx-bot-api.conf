# api.bot.behloleaqil.com -> bot backend on 127.0.0.1:8100
# Standalone site. Does not reference or alter purocoach-api / purocoach-frontend.
# certbot --nginx adds the :443 server block and cert paths in place.
server {
    listen 80;
    listen [::]:80;
    server_name api.bot.behloleaqil.com;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for /ws/stream
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
